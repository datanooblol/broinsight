[project]
name = "broinsight"
version = "0.1.9"
description = "If you don't know what to do with your data, I got you, Bro!"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.3.2",
    "nbformat>=5.10.4",
    "pandas>=2.3.2",
    "plotly>=6.3.0",
    "pydantic>=2.11.7",
    "importlib-resources>=1.3.0; python_version<'3.9'",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "sentence-transformers>=5.1.2",
]

[dependency-groups]
dev = [
    "seaborn>=0.13.2",
    "boto3>=1.40.22",
    "ipykernel>=6.30.1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = {find = {where = ["."], include = ["broinsight*"]}}

[tool.setuptools.package-data]
"broinsight.prompt_hub" = ["*.md"]
"broinsight" = ["prompt_hub/*.md"]

# PyTorch indexes
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# PyTorch sources with platform-specific configuration
[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
